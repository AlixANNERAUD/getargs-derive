name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    if: github.repository_owner == 'AlixANNERAUD'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Version consistency
        run: |
          metadata=$(cargo metadata --format-version 1 --no-deps)
          root=$(echo "$metadata" | jq -r '.packages[] | select(.name == "getargs-derive") | .version')
          macros=$(echo "$metadata" | jq -r '.packages[] | select(.name == "getargs-derive-macros") | .version')
          pin=$(echo "$metadata" | jq -r '.packages[] | select(.name == "getargs-derive") | .dependencies[] | select(.name == "getargs-derive-macros") | .req')
          echo "getargs-derive=$root getargs-derive-macros=$macros pin=$pin"
          test "$root" = "$macros"
          test "$pin" = "=$root"

      - name: Test
        run: cargo test --workspace --all-features

      - name: Package
        run: cargo package --workspace

  release-plz-release:
    needs: validate
    if: github.repository_owner == 'AlixANNERAUD'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    needs: validate
    if: github.repository_owner == 'AlixANNERAUD'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Release PR
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
