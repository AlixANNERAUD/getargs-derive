[workspace]
members = ["macros"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AlixANNERAUD/getargs-derive"
authors = ["Alix ANNERAUD <alix@anneraud.fr>"]

[package]
name = "getargs-derive"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "A derive macro for the getargs crate — auto-generate CLI argument parsing for your structs"
keywords = ["cli", "arguments", "args", "parse", "derive"]
categories = ["command-line-interface"]

[features]
std = []

[package.metadata.docs.rs]
all-features = true

[dependencies]
getargs-derive-macros = { version = "=0.1.0", path = "./macros" }

[dev-dependencies]
getargs = { version = "0.5" }
trybuild = "1"
