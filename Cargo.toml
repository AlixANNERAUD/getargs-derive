[workspace]
members = ["macros"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/AlixANNERAUD/getargs-derive"
authors = ["Alix ANNERAUD <alix@anneraud.fr>"]
rust-version = "1.88"

[package]
name = "getargs-derive"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Clap-style #[derive] command-line argument parser for no_std and embedded Rust: zero allocation, compile-time help, subcommands. Built on getargs."
readme = "README.md"
homepage = "https://github.com/AlixANNERAUD/getargs-derive"
documentation = "https://docs.rs/getargs-derive"
keywords = ["cli", "argument-parser", "no-std", "derive", "embedded"]
categories = ["command-line-interface", "no-std", "no-std::no-alloc", "embedded", "parser-implementations"]

[features]
alloc = []
std = ["alloc", "getargs-derive-macros/std"]
heapless = ["dep:heapless"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
getargs = { version = "0.5", default-features = false }
getargs-derive-macros = { version = "=0.1.1", path = "./macros" }
heapless = { version = "0.9", optional = true, default-features = false }

[dev-dependencies]
getargs = { version = "0.5" }
trybuild = "1"
